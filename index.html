<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload custom brand font: Benaiah (Amharic) -->
    <link
      rel="preload"
      href="/fonts/Benaiah_Abraham_Fikadu.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <!-- Preload the Latin and Ethiopic type system -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Menbere:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Menbere:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Outlined font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Negus Consultants | Study Abroad, Scholarships, Mentorship</title>
    <meta
      name="description"
      content="Negus Consultants: Study abroad guidance, scholarships, mentorship, and practical resources to succeed."
    />
    <meta
      name="keywords"
      content="Negus, study abroad, scholarships, mentorship, consultants"
    />
    <link rel="canonical" href="https://negusconsultants.com/" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#123d2b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Negus Consultants" />
    <meta
      property="og:title"
      content="Negus Consultants | Study Abroad, Scholarships, Mentorship"
    />
    <meta
      property="og:description"
      content="Study abroad guidance, scholarships, mentorship, and practical resources to succeed."
    />
    <meta property="og:url" content="https://negusconsultants.com/" />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Negus Consultants | Study Abroad, Scholarships, Mentorship"
    />
    <meta
      name="twitter:description"
      content="Study abroad guidance, scholarships, mentorship, and practical resources to succeed."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Negus Consultants",
        "url": "https://negusconsultants.com/",
        "logo": "/logo.png",
        "sameAs": [
          "https://www.facebook.com/",
          "https://www.instagram.com/",
          "https://www.linkedin.com/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
